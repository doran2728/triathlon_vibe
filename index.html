<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lap Counter</title>
  <meta name="description" content="A premium lap counter with mm:ss:ms timer and 20 numbered lap tags." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=6" />
  <!-- SheetJS for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="bg-image"></div>
  <main class="container">

    <h1>Lap Counter</h1>
    <div class="counter-display" id="counter">00:00:000</div>

    <div class="tag-setup">
      <div class="setup-field">
        <label for="tagCount">Runners</label>
        <input type="number" id="tagCount" min="1" max="100" value="20" />
      </div>
      <div class="setup-field">
        <label for="targetLaps" title="Target laps (e.g. 12.5 for 5K, 7.5 for 3K, 4 for 1600m)">Target Laps</label>
        <input type="number" id="targetLaps" min="0.5" max="100" step="0.5" value="12.5" />
      </div>
    </div>

    <div class="controls">
      <button class="btn start-btn" id="startBtn">▶ Start</button>
      <button class="btn stop-btn"  id="stopBtn" hidden>■ Stop</button>
      <button class="btn download-btn" id="downloadBtn">↓ Download Excel</button>
    </div>

    <section class="laps" id="lapsSection">
      <div class="lap-buttons" id="lapButtons"></div>
    </section>
  </main>
  <script src="script.js?v=6"></script>
</body>
</html>
